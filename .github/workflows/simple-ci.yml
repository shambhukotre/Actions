name: Simple CI

on:
  push:
    branches:
      - developer
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Tests
        working-directory: BookStore-Rest-API
        run: mvn test

